<!DOCTYPE html>
<html>
<head>
<title>Display</title>

<style>
.block {
    display: block;
    background: lightgreen;
    margin: 10px;
    padding: 10px;
}

.inline {
    display: inline;
    background: lightcoral;
    padding: 5px;
}

.inline-block {
    display: inline-block;
    width: 120px;
    text-align: center;
    background: lightblue;
    margin: 5px;
}
img {
    width: 100px;
}
</style>

</head>
<body>

<h2>Display Property</h2>

<div class="block">
    <img src="bot.png">
</div>

<span class="inline">Inline 1</span>
<span class="inline">Inline 2</span>

<div class="inline-block">
    <img src="bot2.png">
</div>

</body>
</html>
